<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenotazione Confermata | Studio Andrea Sapienza</title>
  <link rel="canonical" href="https://commercialista-roma-jet.vercel.app/conferma.html" />
  <style>
    body { font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0a1128; color: #fff; text-align: center; }
    .loader { border: 4px solid rgba(184, 149, 61, 0.1); border-top: 4px solid #b8953d; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .gold { color: #b8953d; }
    .hidden { display: none; }
    .btn { display: inline-block; text-decoration: none; border: 1px solid #b8953d; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: bold; transition: background 0.2s, color 0.2s; color: #fff; }
    .btn:hover { background: #b8953d; color: #0a1128; }
  </style>
</head>
<body>
  <div id="status">
    <div class="loader"></div>
    <p>Sincronizzazione appuntamento in corso...</p>
  </div>

  <div id="success" class="hidden">
    <h1 class="gold">✓ Prenotazione Confermata!</h1>
    <p>Grazie per aver scelto lo Studio Sapienza.</p>
    <p>Verrai reindirizzato alla Home tra pochi secondi...</p>
    <div style="margin-top: 2rem;">
      <a href="index.html" class="btn gold">← Torna subito alla Home</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { firebaseConfig } from "./crm/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function syncCalendly() {
      const params = new URLSearchParams(window.location.search);
      
      const nome = params.get('invitee_full_name') || params.get('invitee_first_name') + ' ' + params.get('invitee_last_name');
      const email = params.get('invitee_email');
      const startTime = params.get('event_start_time');
      const telefono = params.get('answer_1') || params.get('answer_2') || params.get('answer_3') || "Vedi Calendly";

      if (email || nome) {
        try {
          let dataStr = "Da Calendly";
          let oraStr = "";
          if (startTime) {
            const dt = new Date(startTime);
            dataStr = dt.toLocaleDateString('it-IT');
            oraStr = dt.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
          }

          await addDoc(collection(db, "appointments"), {
            cliente: nome || "Cliente Calendly",
            email: email || "",
            telefono: telefono,
            data: dataStr,
            ora: oraStr,
            note: "Prenotazione automatica via Calendly (Redirect)",
            createdAt: serverTimestamp(),
            source: "calendly_redirect"
          });
          
          window.parent.postMessage("calendly_success", "*");
          
          document.getElementById('status').classList.add('hidden');
          document.getElementById('success').classList.remove('hidden');
          
          // Redirect automatico dopo 2 secondi
          setTimeout(() => {
            window.location.href = "index.html";
          }, 2500);

        } catch (e) {
          console.error("Errore salvataggio:", e);
          document.getElementById('status').innerHTML = "<p>Errore sincronizzazione. <a href='index.html' style='color:#d4af37'>Torna alla Home</a></p>";
        }
      } else {
        document.getElementById('status').innerHTML = "<h1>✓ Grazie!</h1><p>La tua prenotazione è stata ricevuta.</p><br><a href='index.html' style='color:#d4af37'>Torna alla Home</a>";
        setTimeout(() => { window.location.href = "index.html"; }, 3000);
      }
    }

    syncCalendly();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "w1y42abzxc");
  </script>
</body>
</html>
